name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compile (${{ matrix.profile }})
        run: mvn -B clean compile -P${{ matrix.profile }}

      - name: Package production JAR (prod profile only)
        if: matrix.profile == 'prod'
        run: mvn -B package -Pprod -DskipTests

      - name: Upload JAR artifact
        if: matrix.profile == 'prod'
        uses: actions/upload-artifact@v4
        with:
          name: contact-directory-jar
          path: target/contact-directory-*.jar
          retention-days: 7
