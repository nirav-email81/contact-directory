name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compile with Maven profile
        run: mvn -B clean compile -P${{ matrix.profile }}

      - name: Verify environment config exists
        run: |
          test -f config/application-dev.properties
          test -f config/application-prod.properties
          echo "Config files OK for profile: ${{ matrix.profile }}"

  package-prod:
    name: Package production JAR
    runs-on: ubuntu-latest
    needs: compile
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build production fat JAR
        run: mvn -B clean package -Pprod -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: contact-directory-jar-${{ github.sha }}
          path: target/contact-directory-*.jar
          retention-days: 14

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [compile, package-prod]
    if: always()
    steps:
      - name: Report result
        run: |
          echo "## CI result" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| compile | ${{ needs.compile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| package-prod | ${{ needs.package-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.compile.result }}" != "success" ]; then
            exit 1
          fi
          if [ "${{ needs.package-prod.result }}" == "failure" ]; then
            exit 1
          fi
