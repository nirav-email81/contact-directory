name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points at master
        run: |
          git fetch origin master
          TAG_SHA="${{ github.sha }}"
          MASTER_SHA="$(git rev-parse origin/master)"
          if [ "$TAG_SHA" != "$MASTER_SHA" ]; then
            echo "Tag commit $TAG_SHA is not the tip of master ($MASTER_SHA)."
            echo "Create release tags from the master branch only."
            exit 1
          fi
          echo "Tag is on master — OK"

  build-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build production fat JAR
        run: mvn -B clean package -Pprod -DskipTests

      - name: Prepare distribution bundle
        run: |
          mkdir -p dist/contact-directory
          cp target/contact-directory-*.jar dist/contact-directory/
          cp run-prod.bat run.bat compile.bat dist/contact-directory/
          cp -r config dist/contact-directory/
          cd dist && zip -r ../contact-directory-release.zip contact-directory

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/contact-directory-*.jar
            contact-directory-release.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
